<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Build a Website Step by Step</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="page">

  <div class="lang-bar">
    <select id="langSelect" class="lang-select">
      <option value="en" selected>English</option>
      <option value="zh">简体中文</option>
      <option value="ja">日本語</option>
    </select>
  </div>

  <section class="card">
    <div class="slide-top">
      <span class="badge" id="indexLabel">1 / 7</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="slide-body" id="slideBody">
      <h1 class="slide-title" id="slideTitle"></h1>
      <div class="slide-desc" id="slideDesc"></div>
      <pre class="code" id="slideCode"></pre>
    </div>

    <div class="slide-nav">
      <button class="btn btn-ghost" id="prevBtn" type="button"></button>
      <div class="dots" id="dots"></div>
      <button class="btn btn-primary" id="nextBtn" type="button"></button>
    </div>
  </section>

  <section class="card">
    <div class="discuss-head">
      <h2 id="discussTitle"></h2>
      <span class="count" id="commentCount"></span>
    </div>

    <div class="form">
      <input type="text" id="nameInput" maxlength="20" autocomplete="off" />
      <textarea id="contentInput" maxlength="500"></textarea>
      <div class="form-foot">
        <span class="hint" id="formHint"></span>
        <span class="counter" id="charCounter">0 / 500</span>
        <button class="btn btn-primary" id="publishBtn" type="button"></button>
      </div>
    </div>

    <ul class="comment-list" id="commentList"></ul>
  </section>

</div>

<script>
const LANGS = {
  en: { htmlLang: 'en' },
  zh: { htmlLang: 'zh-CN' },
  ja: { htmlLang: 'ja' }
};

const LANG_KEY = 'tutorial-lang';
const STORAGE_KEY = 'tutorial-comments-v1';
const NICKNAME_KEY = 'tutorial-nickname';

const CONTENT = {
  en: {
    ui: {
      docTitle: 'Build a Website Step by Step',
      prev: '← Prev', next: 'Next →',
      discussTitle: '💬 Discussion',
      namePlaceholder: 'Your nickname',
      contentPlaceholder: 'Share your thoughts… (Ctrl / ⌘ + Enter to post)',
      publish: 'Post', delete: 'Delete',
      countN: n => `${n} comments`,
      empty: 'No comments yet. Be the first to share!',
      hintName: 'Enter nickname.', hintContent: 'Comment cannot be empty.', hintOk: 'Posted ✓',
      timeJustNow: 'just now', timeMin: n => `${n} min ago`, timeHour: n => `${n} hr ago`,
      counter: (n, max) => `${n} / ${max}`
    },
    slides: [
      { title: 'Step 1: Meet HTML', desc: ['HTML defines the structure. It is the skeleton of every webpage.'] },
      { title: 'Step 2: Write CSS', desc: ['CSS controls the look. It adds colors, fonts, and layout to the structure.'] },
      { title: 'Step 3: Add JavaScript', desc: ['JS drives behavior. It makes pages interactive and dynamic.'] },
      { title: 'Step 4: Frontend Frameworks', desc: ['When UIs get complex, frameworks like React or Vue help manage state and components efficiently.'] },
      { title: 'Step 5: Backend & APIs', desc: ['Websites need data. Backends like Node.js and Express handle logic and return JSON data.'] },
      { title: 'Step 6: Full-stack Frameworks', desc: ['Next.js blends frontend and backend together, handling routing and server-side rendering out of the box.'] },
      { title: 'Step 7: Deploy', desc: ['Host your site on the cloud (like Render or Vercel) to let the whole world access it.'] }
    ]
  },
  zh: {
    ui: {
      docTitle: '手把手教你做一个网站',
      prev: '← 上一页', next: '下一页 →',
      discussTitle: '💬 讨论区',
      namePlaceholder: '你的昵称（最多 20 字）',
      contentPlaceholder: '说说你的想法…（Ctrl / ⌘ + Enter 快速发布）',
      publish: '发布', delete: '删除',
      countN: n => `共 ${n} 条讨论`,
      empty: '还没有人发言，来留下第一条评论吧～',
      hintName: '请先填写昵称～', hintContent: '评论内容不能为空哦～', hintOk: '发布成功 ✓',
      timeJustNow: '刚刚', timeMin: n => `${n} 分钟前`, timeHour: n => `${n} 小时前`,
      counter: (n, max) => `${n} / ${max}`
    },
    slides: [
      { title: '第一步：认识 HTML', desc: ['HTML 定义了网页的骨架。'] },
      { title: '第二步：写 CSS', desc: ['CSS 负责长相，为骨架添加颜色、字体和布局。'] },
      { title: '第三步：加 JavaScript', desc: ['JS 负责行为，让页面动起来，响应用户操作。'] },
      { title: '第四步：前端框架', desc: ['当页面复杂时，React 或 Vue 等前端框架能帮你更好地管理状态和组件。'] },
      { title: '第五步：后端与接口', desc: ['网页需要数据。Node.js 等后端负责处理逻辑并返回 JSON 接口。'] },
      { title: '第六步：全栈框架', desc: ['像 Next.js 这样的全栈框架把前后端融合，开箱即用地处理路由和服务端渲染。'] },
      { title: '第七步：部署上线', desc: ['把代码托管到云端（如 Render 或 Vercel），让全世界都能访问。'] }
    ]
  },
  ja: {
    ui: {
      docTitle: 'ウェブサイト制作',
      prev: '← 前へ', next: '次へ →',
      discussTitle: '💬 ディスカッション',
      namePlaceholder: 'ニックネーム',
      contentPlaceholder: '感想を書く…',
      publish: '投稿', delete: '削除',
      countN: n => `${n} コメント`,
      empty: 'まだコメントはありません。',
      hintName: '名前を入力してください。', hintContent: 'コメントを入力してください。', hintOk: '投稿しました ✓',
      timeJustNow: 'たった今', timeMin: n => `${n} 分前`, timeHour: n => `${n} 時間前`,
      counter: (n, max) => `${n} / ${max}`
    },
    slides: [
      { title: 'ステップ1：HTML', desc: ['HTMLはウェブページの骨格を定義します。'] },
      { title: 'ステップ2：CSS', desc: ['CSSは見た目を担当し、色やフォント、レイアウトを設定します。'] },
      { title: 'ステップ3：JavaScript', desc: ['JSは動きを担当し、ページをインタラクティブにします。'] },
      { title: 'ステップ4：フロントエンドフレームワーク', desc: ['UIが複雑になると、ReactやVueが状態とコンポーネントの管理を助けます。'] },
      { title: 'ステップ5：バックエンドとAPI', desc: ['Webサイトにはデータが必要です。Node.jsなどがロジックを処理し、JSONを返します。'] },
      { title: 'ステップ6：フルスタックフレームワーク', desc: ['Next.jsはフロントとバックを統合し、ルーティングとSSRを提供します。'] },
      { title: 'ステップ7：デプロイ', desc: ['RenderやVercelなどのクラウドにホストし、世界中に公開します。'] }
    ]
  }
};

const CODE_SNIPPETS = [
  '<!-- Structure -->\n<h1>Hello World</h1>\n<p>This is HTML</p>',
  '/* Style */\nh1 {\n  color: #333;\n  font-size: 24px;\n}',
  '// Logic\nconst btn = document.querySelector("#btn");\nbtn.addEventListener("click", () => {\n  alert("Clicked!");\n});',
  '// React Component\nfunction App() {\n  return <h1>Hello React!</h1>;\n}',
  '// Express API\napp.get("/api/users", (req, res) => {\n  res.json({ name: "Alice" });\n});',
  '// Next.js Page\nexport default function Home() {\n  return <h1>Welcome to Next.js</h1>;\n}',
  '# Deploy\n> Push to GitHub\n> Connect to Render / Vercel\n> Done!'
];

const slideTitleEl = document.getElementById('slideTitle');
const slideDescEl = document.getElementById('slideDesc');
const slideCodeEl = document.getElementById('slideCode');
const slideBody = document.getElementById('slideBody');
const indexLabel = document.getElementById('indexLabel');
const progressBar = document.getElementById('progressBar');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dotsEl = document.getElementById('dots');
const langSelect = document.getElementById('langSelect');
const discussTitle = document.getElementById('discussTitle');
const nameInput = document.getElementById('nameInput');
const contentInput = document.getElementById('contentInput');
const publishBtn = document.getElementById('publishBtn');
const commentList = document.getElementById('commentList');
const commentCount = document.getElementById('commentCount');
const formHint = document.getElementById('formHint');
const charCounter = document.getElementById('charCounter');

let currentLang = 'en'; 
let currentIndex = 0;

function t() { return CONTENT[currentLang].ui; }
function slides() { return CONTENT[currentLang].slides; }

function renderDots() {
  dotsEl.innerHTML = '';
  slides().forEach((_, i) => {
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'dot' + (i === currentIndex ? ' active' : '');
    dot.addEventListener('click', () => goToSlide(i));
    dotsEl.appendChild(dot);
  });
}

function paintSlide(i) {
  const s = slides()[i];
  if (!s) return;
  slideTitleEl.textContent = s.title;
  slideDescEl.innerHTML = '';
  s.desc.forEach(line => {
    const p = document.createElement('p');
    p.textContent = line;
    slideDescEl.appendChild(p);
  });
  slideCodeEl.textContent = CODE_SNIPPETS[i] || '';
  indexLabel.textContent = `${i + 1} / ${slides().length}`;
  progressBar.style.width = ((i + 1) / slides().length * 100) + '%';
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === slides().length - 1;
  
  Array.from(dotsEl.children).forEach((dot, idx) => {
    dot.classList.toggle('active', idx === i);
  });
}

function goToSlide(target) {
  if (target < 0 || target >= slides().length || target === currentIndex) return;
  currentIndex = target;
  slideBody.classList.add('is-fading');
  setTimeout(() => {
    paintSlide(currentIndex);
    slideBody.classList.remove('is-fading');
  }, 180);
}

prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));

function loadComments() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveComments(list) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
}

function formatTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return t().timeJustNow;
  if (diff < 3600000) return t().timeMin(Math.floor(diff / 60000));
  if (diff < 86400000) return t().timeHour(Math.floor(diff / 3600000));
  return new Date(ts).toLocaleDateString(LANGS[currentLang].htmlLang);
}

function renderComments() {
  const list = loadComments();
  commentList.innerHTML = '';
  commentCount.textContent = list.length ? t().countN(list.length) : '';
  
  if (!list.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = t().empty;
    commentList.appendChild(li);
    return;
  }
  
  list.sort((a, b) => b.time - a.time).forEach(c => {
    const li = document.createElement('li');
    li.className = 'comment';
    
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = c.name.charAt(0).toUpperCase();
    avatar.style.background = `hsl(${c.name.length * 40 % 360}, 60%, 55%)`;
    
    const main = document.createElement('div');
    main.className = 'comment-main';
    
    const head = document.createElement('div');
    head.className = 'comment-head';
    
    const nameSpan = document.createElement('span');
    nameSpan.className = 'comment-name';
    nameSpan.textContent = c.name;
    
    const timeSpan = document.createElement('span');
    timeSpan.className = 'comment-time';
    timeSpan.textContent = formatTime(c.time);
    
    const delBtn = document.createElement('button');
    delBtn.className = 'comment-del';
    delBtn.textContent = t().delete;
    delBtn.onclick = () => {
      saveComments(loadComments().filter(x => x.id !== c.id));
      renderComments();
    };
    
    head.appendChild(nameSpan);
    head.appendChild(timeSpan);
    head.appendChild(delBtn);
    
    const contentP = document.createElement('p');
    contentP.className = 'comment-content';
    contentP.textContent = c.content;
    
    main.appendChild(head);
    main.appendChild(contentP);
    li.appendChild(avatar);
    li.appendChild(main);
    commentList.appendChild(li);
  });
}

function publishComment() {
  const name = nameInput.value.trim();
  const content = contentInput.value.trim();
  if (!name) { formHint.textContent = t().hintName; formHint.className = 'hint'; return; }
  if (!content) { formHint.textContent = t().hintContent; formHint.className = 'hint'; return; }
  
  const list = loadComments();
  list.push({ id: Date.now().toString(), name, content, time: Date.now() });
  saveComments(list);
  
  contentInput.value = '';
  charCounter.textContent = t().counter(0, 500);
  formHint.textContent = t().hintOk;
  formHint.className = 'hint ok';
  setTimeout(() => { formHint.textContent = ''; formHint.className = 'hint'; }, 2000);
  
  try { localStorage.setItem(NICKNAME_KEY, name); } catch(e) {}
  renderComments();
}

publishBtn.addEventListener('click', publishComment);
contentInput.addEventListener('input', () => {
  charCounter.textContent = t().counter(contentInput.value.length, 500);
});

function applyLanguage(lang) {
  if (!CONTENT[lang]) lang = 'en';
  currentLang = lang;
  document.documentElement.lang = LANGS[lang].htmlLang;
  document.title = t().docTitle;
  prevBtn.textContent = t().prev;
  nextBtn.textContent = t().next;
  discussTitle.textContent = t().discussTitle;
  nameInput.placeholder = t().namePlaceholder;
  contentInput.placeholder = t().contentPlaceholder;
  publishBtn.textContent = t().publish;
  charCounter.textContent = t().counter(contentInput.value.length, 500);
  
  if (currentIndex >= slides().length) currentIndex = 0;
  renderDots();
  paintSlide(currentIndex);
  renderComments();
}

langSelect.addEventListener('change', () => {
  applyLanguage(langSelect.value);
  try { localStorage.setItem(LANG_KEY, langSelect.value); } catch(e) {}
});

try {
  const savedName = localStorage.getItem(NICKNAME_KEY);
  if (savedName) nameInput.value = savedName;
  const savedLang = localStorage.getItem(LANG_KEY);
  if (savedLang && CONTENT[savedLang]) {
    currentLang = savedLang;
    langSelect.value = savedLang;
  } else {
    currentLang = 'en';
    langSelect.value = 'en';
  }
} catch(e) {}

applyLanguage(currentLang);
</script>
</body>
</html>
